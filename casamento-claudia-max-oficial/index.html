
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#382015">

    <title>Cláudia & Max | Convite de Casamento</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- TELA INICIAL -->
    <section id="initialScreen">

        <div class="initial-content">

            <div class="envelope">

                <img
                    src="assets/envelope-fechado.png"
                    alt="Envelope de casamento Cláudia e Max"
                >

                <button
                    id="openButton"
                    class="seal-button"
                    aria-label="Abrir convite C e M"
                ></button>

            </div>

            <p class="instruction">
                ✧ Toque no selo para abrir o convite ✧
            </p>

        </div>

    </section>

    <!-- VIDEO DE ABERTURA -->
    <section id="videoScreen" hidden>

        <video
            id="openingVideo"
            playsinline
            preload="auto"
        >
            <source src="assets/abertura.mp4" type="video/mp4">
        </video>

        <button id="playButton" hidden>
            ▶ Reproduzir abertura
        </button>

        <button id="skipButton">
            Pular abertura »
        </button>

    </section>

    <!-- CONVITE FINAL -->
    <section id="invitationScreen" hidden>

        <div class="invitation-container">

            <img
                src="assets/convite.jpg"
                alt="Convite de casamento de Cláudia Cristina e Max Alexandre"
                class="invitation-image"
            >

            <button id="replayButton">
                ↻ Rever abertura
            </button>

        </div>

    </section>

</body>
</html>
