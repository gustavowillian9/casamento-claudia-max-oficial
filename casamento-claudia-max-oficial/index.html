
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#382015">

    <title>Cláudia & Max | Convite de Casamento</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- ABERTURA COM VIDEO -->
    <section id="videoScreen">

        <video
            id="openingVideo"
            autoplay
            muted
            playsinline
            preload="auto"
        >
            <source src="assets/abertura.mp4" type="video/mp4">
        </video>

        <button id="playButton" class="play-button" hidden>
            ▶ Iniciar convite
        </button>

        <div class="video-controls">

            <button id="soundButton">
                🔇 Ativar som
            </button>

            <button id="skipButton">
                Pular abertura »
            </button>

        </div>

    </section>

    <!-- CONVITE FINAL -->
    <section id="invitationScreen" hidden>

        <div class="invitation-container">

            <img
                src="assets/convite.jpg"
                alt="Convite de casamento de Cláudia Cristina e Max Alexandre"
                class="invitation-image"
            >

            <button id="replayButton" class="replay-button">
                ↻ Rever abertura
            </button>

        </div>

    </section>

</body>
</html>
